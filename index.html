<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>FootballMA</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Vazirmatn',sans-serif;background:#000;color:#fff;max-width:480px;margin:0 auto;min-height:100vh;overflow-x:hidden;-webkit-user-select:none;user-select:none}
img{-webkit-user-drag:none}
/* ===== LIQUID GLASS ===== */
.glass{background:rgba(45,45,60,.55);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border:1px solid rgba(255,255,255,.12);border-radius:24px;box-shadow:0 8px 32px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.1)}
.glass2{background:rgba(30,30,45,.6);backdrop-filter:blur(30px) saturate(150%);-webkit-backdrop-filter:blur(30px) saturate(150%);border:1px solid rgba(255,255,255,.08);border-radius:20px;box-shadow:0 4px 16px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.06)}
.glass3{background:rgba(25,25,40,.5);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.06);border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
/* Header */
.hd{padding:14px 16px 10px;position:sticky;top:0;z-index:100;background:rgba(0,0,0,.7);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border-bottom:1px solid rgba(255,255,255,.06)}
.logo{font-size:22px;font-weight:900;color:#fff;letter-spacing:-.5px}.logo b{color:#3b82f6}
.search{margin-top:10px}
.search input{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:10px 16px;color:#fff;font-family:'Vazirmatn';font-size:13px;outline:none;backdrop-filter:blur(20px)}
.search input::placeholder{color:rgba(255,255,255,.3)}
/* Pages */
.pg{display:none;padding:0 14px 75px}.pg.on{display:block}
.st{font-size:11px;font-weight:700;color:rgba(255,255,255,.35);margin:16px 0 8px;text-transform:uppercase;letter-spacing:.5px;padding:0 4px}
/* Match */
.mc{padding:10px 14px;margin-bottom:4px;cursor:pointer}
.mc:active{transform:scale(.98);transition:transform .1s}
.mc-row{display:flex;align-items:center;padding:4px 0}
.mc-team{display:flex;align-items:center;gap:8px;flex:1}
.tl{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0;border:1px solid rgba(255,255,255,.12);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.mc-nm{font-size:13px;font-weight:600}
.mc-ct{text-align:center;min-width:50px}
.mc-tm{font-size:11px;color:rgba(255,255,255,.4)}
.mc-lg{font-size:9px;color:rgba(255,255,255,.3);margin-bottom:3px}
/* Date */
.ds{display:flex;gap:6px;overflow-x:auto;padding:8px 0;margin-bottom:10px;scrollbar-width:none}
.ds::-webkit-scrollbar{display:none}
.di{flex-shrink:0;text-align:center;padding:8px 12px;cursor:pointer;min-width:56px;border-radius:16px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.04);backdrop-filter:blur(12px)}
.di.on{background:rgba(59,130,246,.3);border-color:rgba(59,130,246,.5)}
.di .dw{font-size:8px;color:rgba(255,255,255,.3)}.di.on .dw{color:rgba(255,255,255,.6)}
.di .dd{font-size:14px;font-weight:800;margin-top:1px}
.di .dm{font-size:9px;color:rgba(255,255,255,.3)}.di.on .dm{color:rgba(255,255,255,.5)}
/* News */
.nf{border-radius:22px;overflow:hidden;cursor:pointer;margin-bottom:12px;position:relative;border:1px solid rgba(255,255,255,.08)}
.nf img{width:100%;height:220px;object-fit:cover}
.nf .ov{position:absolute;bottom:0;left:0;right:0;padding:16px;background:linear-gradient(transparent,rgba(0,0,0,.95))}
.nf .tg{font-size:10px;color:#3b82f6;font-weight:700;margin-bottom:4px}
.nf .tt{font-size:15px;font-weight:700;line-height:1.6;color:#fff}
.nh{display:flex;gap:10px;margin-bottom:6px;padding:10px;border-radius:16px;cursor:pointer;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.05)}
.nh:active{transform:scale(.98);transition:transform .1s}
.nh img{width:80px;height:60px;border-radius:12px;object-fit:cover;flex-shrink:0}
.nh-body{flex:1;display:flex;flex-direction:column;justify-content:center}
.nh-t{font-size:12px;font-weight:700;line-height:1.6}
.nh-d{font-size:10px;color:rgba(255,255,255,.4);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* Transfer */
.tc{padding:14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;cursor:pointer}
.tc:active{transform:scale(.98);transition:transform .1s}
.tc-player{text-align:center;min-width:56px}
.tc-player img{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05)}
.tc-player .pn{font-size:9px;color:rgba(255,255,255,.6);margin-top:4px;line-height:1.3}
.tc-from,.tc-to{flex:1;text-align:center}
.tc-from .nm,.tc-to .nm{font-size:10px;font-weight:700;margin-top:3px}
.tc-arrow{font-size:18px;color:#3b82f6;font-weight:900}
/* Search */
.sr{display:none;margin-bottom:10px}.sr.on{display:block}
.src{padding:14px;margin-bottom:6px;border-right:3px solid #3b82f6;cursor:pointer}
.src:active{opacity:.7}
.src h3{font-size:14px;font-weight:700;color:#3b82f6;margin-bottom:4px}
.src p{font-size:11px;color:rgba(255,255,255,.5);line-height:1.8;margin-bottom:4px}
.src .s{display:inline-block;background:rgba(255,255,255,.06);padding:3px 8px;border-radius:8px;margin:2px;font-size:9px;color:#60a5fa}
/* Detail */
.detail{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.92);z-index:200;overflow-y:auto;max-width:480px;margin:0 auto;backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px)}
.detail.on{display:block}
.dh{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:201;border-bottom:1px solid rgba(255,255,255,.06);background:rgba(0,0,0,.7);backdrop-filter:blur(30px)}
.dh button{background:none;color:#3b82f6;border:none;font-size:18px;cursor:pointer}
.dc{padding:16px}
.dt{text-align:center;padding:20px 0;display:flex;justify-content:space-around;align-items:center}
.dt-t{text-align:center;width:85px}
.dt-t .nm{margin-top:6px;font-size:12px;font-weight:700}
.dt-vs{font-size:20px;font-weight:900;color:#3b82f6}
.ds2{padding:14px;margin-bottom:10px}
.ds2 h3{font-size:12px;font-weight:700;color:#3b82f6;margin-bottom:8px}
.di2{padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:11px;color:rgba(255,255,255,.6);line-height:1.8}
.di2:last-child{border:none}
.di2 .l{color:rgba(255,255,255,.3);font-size:10px}
/* Fav */
.fav-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.fav-tag{padding:7px 14px;border-radius:22px;font-size:11px;cursor:pointer;background:rgba(255,255,255,.05);color:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.06);backdrop-filter:blur(8px);transition:all .2s}
.fav-tag.on{background:rgba(59,130,246,.25);color:#fff;border-color:rgba(59,130,246,.4)}
.fav-tag.g.on{background:rgba(34,197,94,.2);border-color:rgba(34,197,94,.4)}
/* More */
.sg-item{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer;margin-bottom:4px;border-radius:16px;background:rgba(255,255,255,.04);backdrop-filter:blur(12px)}
.sg-item:active{transform:scale(.98);transition:transform .1s}
.sg-item .icon{font-size:20px;margin-left:12px}
.sg-item .label{flex:1;font-size:13px;font-weight:600}
.sg-item .arrow{color:rgba(255,255,255,.25);font-size:12px}
/* Timer */
.timer{text-align:center;margin:20px 0}
.timer .num{font-size:36px;font-weight:900;color:#3b82f6;font-variant-numeric:tabular-nums;text-shadow:0 0 20px rgba(59,130,246,.3)}
.timer .lbl{font-size:10px;color:rgba(255,255,255,.3);margin-top:4px}
/* Nav */
.bn{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:rgba(0,0,0,.8);border-top:1px solid rgba(255,255,255,.06);display:flex;z-index:100;backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%)}
.bi{flex:1;text-align:center;padding:7px 0;cursor:pointer;color:rgba(255,255,255,.25);transition:color .2s}
.bi.on{color:#fff}
.bi svg{width:20px;height:20px;fill:currentColor}
.bi .bl{font-size:9px;margin-top:2px}
.empty{text-align:center;color:rgba(255,255,255,.3);padding:24px;font-size:12px}
.about{text-align:center;color:rgba(255,255,255,.2);font-size:10px;margin-top:24px;line-height:1.8}
.back-btn{width:100%;padding:12px;background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,255,255,.08);border-radius:16px;font-family:Vazirmatn;cursor:pointer;font-size:13px;margin-top:14px}
</style>
</head>
<body oncontextmenu="return false">
<div class="hd">
<div class="logo">⚽ Football<b>MA</b></div>
<div class="search"><input id="si" placeholder="🔍 جستجوی تیم یا بازیکن..." oninput="doSearch(this.value)"></div>
</div>
<div class="pg on" id="pg-fav"><div id="fvc"></div></div>
<div class="pg" id="pg-match"><div id="dc"></div><div id="mc"></div></div>
<div class="pg" id="pg-news"><div id="nc"></div></div>
<div class="pg" id="pg-more"><div id="moc"></div></div>
<div class="sr" id="sr"></div>
<div class="detail" id="det"><div class="dh"><button onclick="document.getElementById('det').classList.remove('on')">→</button><span style="font-weight:700;font-size:14px" id="dtT"></span><span></span></div><div class="dc" id="dtB"></div></div>
<div class="bn">
<div class="bi on" data-p="fav"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg><div class="bl" data-t="home">Your Fav</div></div>
<div class="bi" data-p="match"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v20M2 12h20" stroke="currentColor" stroke-width="1"/></svg><div class="bl" data-t="match">مسابقات</div></div>
<div class="bi" data-p="news"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg><div class="bl" data-t="news">اخبار</div></div>
<div class="bi" data-p="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg><div class="bl" data-t="more">بیشتر</div></div>
</div>
<script>
let D={},selDate=new Date().toISOString().split('T')[0],curLang='fa';
const C={'آرسنال':'#EF0107','لیورپول':'#C8102E','چلسی':'#034694','منچسترسیتی':'#6CABDD','منچستریونایتد':'#DA291C','تاتنهام':'#132257','نیوکاسل':'#241F20','استون ویلا':'#670E36','رئال مادرید':'#FEBE10','بارسلونا':'#A50044','اتلتیکو مادرید':'#CB3524','اینترمیلان':'#010E80','آث میلان':'#FB090B','ناپولی':'#12A0D7','یوونتوس':'#fff','بایرن مونیخ':'#DC052D','دورتموند':'#FDE100','لورکوزن':'#E32221','پاریسن‌ژرمن':'#004170','پرسپولیس':'#D4003C','استقلال':'#003DA5','سپاهان':'#FFD700','Al-Hilal':'#1a5276','Galatasaray':'#C8102E','Al Nassr':'#FFD700','Inter Miami':'#ff69b4'};
function tl(t,s){s=s||26;return '<div class="tl" style="width:'+s+'px;height:'+s+'px;background:'+(C[t]||'#333')+';font-size:'+(s*.4)+'px">'+t.charAt(0)+'</div>';}
function tn(x){return curLang==='en'?(x.title_en||x.title):x.title;}
function td(x){return curLang==='en'?(x.desc_en||x.desc):x.desc;}
document.querySelectorAll('.bi').forEach(function(b){b.onclick=function(){document.querySelectorAll('.bi').forEach(function(x){x.classList.remove('on')});b.classList.add('on');document.querySelectorAll('.pg').forEach(function(p){p.classList.remove('on')});document.getElementById('pg-'+b.dataset.p).classList.add('on');document.getElementById('sr').classList.remove('on');};});
// FAV
function gf(){try{return JSON.parse(localStorage.getItem('fm_fav'))||{teams:[],players:[]};}catch(e){return{teams:[],players:[]};}}
function sf(f){localStorage.setItem('fm_fav',JSON.stringify(f));}
function togTeam(t){var f=gf();var i=f.teams.indexOf(t);if(i>-1)f.teams.splice(i,1);else f.teams.push(t);sf(f);rFav();}
function togPlayer(p){var f=gf();var i=f.players.indexOf(p);if(i>-1)f.players.splice(i,1);else f.players.push(p);sf(f);rFav();}
var AT=['آرسنال','لیورپول','چلسی','منچسترسیتی','منچستریونایتد','تاتنهام','رئال مادرید','بارسلونا','اینترمیلان','آث میلان','یوونتوس','بایرن مونیخ','دورتموند','پاریسن‌ژرمن','پرسپولیس','استقلال'];
var AP=['امباپه','هالند','مسی','رونالدو','صلاح','آزمون','طارمی'];
function rFav(){var f=gf(),n=D.football_news||[],fx=D.fixtures||[];
var h='<div class="st">⭐ تیم مورد علاقه</div><div class="fav-tags">';
for(var i=0;i<AT.length;i++){h+='<div class="fav-tag'+(f.teams.indexOf(AT[i])>-1?' on':'')+'" onclick="togTeam(\''+AT[i]+'\')">'+AT[i]+'</div>';}
h+='</div><div class="st">⭐ بازیکن مورد علاقه</div><div class="fav-tags">';
for(var i=0;i<AP.length;i++){h+='<div class="fav-tag g'+(f.players.indexOf(AP[i])>-1?' on':'')+'" onclick="togPlayer(\''+AP[i]+'\')">'+AP[i]+'</div>';}
h+='</div>';
if(f.teams.length>0&&n.length>0){h+='<div class="st">📰 اخبار تیم‌های مورد علاقه</div>';for(var j=0;j<n.length&&h.split('nh').length<5;j++){var x=n[j];if(f.teams.some(function(t){return(x.title+' '+(x.title_en||'')).indexOf(t)>-1;})){h+='<div class="nh glass3" onclick="oN('+j+')">'+(x.img?'<img src="'+x.img+'">':'')+'<div class="nh-body"><div class="nh-t">'+tn(x)+'</div><div class="nh-d">'+td(x)+'</div></div></div>';}}}
if(f.teams.length>0&&fx.length>0){h+='<div class="st">🏟️ بازی‌های تیم‌های مورد علاقه</div>';for(var j=0;j<fx.length&&j<4;j++){var m=fx[j];if(f.teams.some(function(t){return m.home.indexOf(t)>-1||m.away.indexOf(t)>-1;})){h+='<div class="mc glass3"><div class="mc-lg">'+m.league+'</div><div class="mc-row"><div class="mc-team">'+tl(m.home)+'<div class="mc-nm">'+m.home+'</div></div><div class="mc-ct"><div class="mc-tm">'+m.time+'</div></div><div class="mc-team" style="justify-content:flex-end"><div class="mc-nm">'+m.away+'</div>'+tl(m.away)+'</div></div></div>';}}}
document.getElementById('fvc').innerHTML=h;}
// MATCH
function rMatch(){var fxd=D.fixtures_by_date||{};var dates=Object.keys(fxd).sort();
if(!dates.length){document.getElementById('mc').innerHTML='<div class="empty">بازی نداریم</div>';return;}
var dh='<div class="ds">';for(var i=0;i<dates.length;i++){var d=dates[i];var dt=new Date(d+'T00:00:00');var wd=['ی','س','چ','پ','ج','ش','ی'][dt.getDay()];dh+='<div class="di'+(d===selDate?' on':'')+'" onclick="selDate=\''+d+'\';rMatch()"><div class="dw">'+wd+'</div><div class="dd">'+dt.getDate()+'</div><div class="dm">'+(dt.getMonth()+1)+'/'+dt.getDate()+'</div></div>';}
dh+='</div>';document.getElementById('dc').innerHTML=dh;
var info=fxd[selDate];if(!info||!info.matches.length){document.getElementById('mc').innerHTML='<div class="empty">بازی مهمی نیست</div>';return;}
var g={};for(var j=0;j<info.matches.length;j++){var m=info.matches[j];if(!g[m.league])g[m.league]=[];g[m.league].push(m);}
var h='';for(var l in g){h+='<div class="st">'+l+'</div>';for(var k=0;k<g[l].length;k++){var m=g[l][k];h+='<div class="mc glass3" onclick="oMatch(\''+m.home+'|'+m.away+'|'+m.league+'|'+m.time+'\')"><div class="mc-lg">'+m.league+'</div><div class="mc-row"><div class="mc-team">'+tl(m.home)+'<div class="mc-nm">'+m.home+'</div></div><div class="mc-ct"><div class="mc-tm">'+m.time+'</div></div><div class="mc-team" style="justify-content:flex-end"><div class="mc-nm">'+m.away+'</div>'+tl(m.away)+'</div></div></div>';}
document.getElementById('mc').innerHTML=h;}
function oMatch(d){var p=d.split('|');var home=p[0],away=p[1],league=p[2],time=p[3];
var rel=(D.football_news||[]).filter(function(x){return(x.title+' '+(x.title_en||'')).indexOf(home)>-1||(x.title+' '+(x.title_en||'')).indexOf(away)>-1;});
var h='<div class="dt"><div class="dt-t">'+tl(home,50)+'<div class="nm">'+home+'</div></div><div class="dt-vs">VS</div><div class="dt-t">'+tl(away,50)+'<div class="nm">'+away+'</div></div></div>';
h+='<div class="ds2 glass2"><h3>📋 اطلاعات بازی</h3><div class="di2"><span class="l">🏆 لیگ:</span> '+league+'</div><div class="di2"><span class="l">⏰ ساعت:</span> '+time+'</div><div class="di2"><span class="l">🏠 میزبان:</span> '+home+'</div><div class="di2"><span class="l">✈️ مهمان:</span> '+away+'</div></div>';
if(rel.length>0){h+='<div class="ds2 glass2"><h3>📰 اخبار مرتبط</h3>';for(var i=0;i<Math.min(3,rel.length);i++){h+='<div class="di2"><strong>'+tn(rel[i])+'</strong><br>'+td(rel[i])+'</div>';}h+='</div>';}
document.getElementById('dtB').innerHTML=h;document.getElementById('dtT').textContent=home+' vs '+away;document.getElementById('det').classList.add('on');}
// NEWS
function rNews(){var n=D.football_news||[];var tr=D.transfers||[];
if(n.length===0){document.getElementById('nc').innerHTML='<div class="empty">خبری نیست</div>';return;}
var h='';
if(n[0]){var x=n[0];h+='<div class="nf glass" onclick="oN(0)">'+(x.img?'<img src="'+x.img+'">':'')+'<div class="ov"><div class="tg">📰 خبر ویژه</div><div class="tt">'+tn(x)+'</div></div></div>';}
for(var i=1;i<Math.min(8,n.length);i++){var x=n[i];h+='<div class="nh glass3" onclick="oN('+i+')">'+(x.img?'<img src="'+x.img+'">':'')+'<div class="nh-body"><div class="nh-t">'+tn(x)+'</div><div class="nh-d">'+td(x)+'</div></div></div>';}
document.getElementById('nc').innerHTML=h;}
function oN(i){var all=(D.football_news||[]).concat(D.transfers||[]);var n=all[i];if(!n)return;
var h='';if(n.img)h+='<img src="'+n.img+'" style="width:100%;max-height:250px;object-fit:cover;border-radius:16px;margin-bottom:12px">';
h+='<h2 style="font-size:16px;line-height:1.8;margin-bottom:10px">'+tn(n)+'</h2><p style="font-size:12px;color:rgba(255,255,255,.5);line-height:2.2">'+td(n)+'</p>';
document.getElementById('dtB').innerHTML=h;document.getElementById('dtT').textContent='خبر کامل';document.getElementById('det').classList.add('on');}
// MORE
function rMore(){var h='<div class="st" style="margin-top:16px">بیشتر</div>';
h+='<div class="sg-item glass3" onclick="showTransfers()"><span class="icon">🔄</span><span class="label">نقل و انتقالات</span><span class="arrow">←</span></div>';
h+='<div class="sg-item glass3" onclick="showStandings()"><span class="icon">🏆</span><span class="label">جدول لیگ‌ها</span><span class="arrow">←</span></div>';
h+='<div class="sg-item glass3" onclick="showLang()"><span class="icon">🌐</span><span class="label">زبان / Language</span><span class="arrow">←</span></div>';
h+='<div class="timer"><div class="num" id="timerNum">60</div><div class="lbl">ثانیه تا آپدیت بعدی</div></div>';
h+='<div class="about">FootballMA v0.0.3.1<br>Made in Alireza 🔥</div>';
document.getElementById('moc').innerHTML=h;}
function showTransfers(){var tr=D.transfers||[];var h='<div class="st" style="margin-top:16px">🔄 نقل و انتقالات جهان</div>';
for(var i=0;i<tr.length;i++){var x=tr[i];var te=(x.title_en||'').toLowerCase();
var clubs=['manchester city','real madrid','liverpool','arsenal','chelsea','barcelona','bayern','psg','inter milan','ac milan','napoli','juventus','atletico','dortmund','al-hilal','al nassr','galatasaray','inter miami','leverkusen'];
var from='',to='';for(var j=0;j<clubs.length;j++){if(te.indexOf(clubs[j])>-1){if(!from)from=clubs[j];else to=clubs[j];}}
var pName=(x.title||'').split(' ').slice(0,2).join(' ');
h+='<div class="tc glass2" onclick="oN('+(D.football_news.length+i)+')"><div class="tc-player"><div class="tl" style="width:48px;height:48px;font-size:16px;background:#333">'+pName.charAt(0)+'</div><div class="pn">'+pName+'</div></div><div class="tc-from">'+tl(from||'?',20)+'<div class="nm">'+(from||'')+'</div></div><div class="tc-arrow">→</div><div class="tc-to">'+tl(to||'?',20)+'<div class="nm">'+(to||'')+'</div></div></div>';}
h+='<button class="back-btn" onclick="rMore()">← بازگشت</button>';
document.getElementById('moc').innerHTML=h;}
function showStandings(){var t=D.standings||{};var h='<div class="st" style="margin-top:16px">🏆 جدول لیگ‌ها</div>';
for(var l in t){h+='<div class="ds2 glass2"><h3>'+l+'</h3>';for(var i=0;i<t[l].length;i++){var x=t[l][i];h+='<div style="display:flex;align-items:center;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:10px"><div style="width:18px;text-align:center;color:rgba(255,255,255,.3)">'+(i+1)+'</div><div style="flex:1;display:flex;align-items:center;gap:5px">'+tl(x.name,16)+' '+x.name+'</div><div style="width:22px;text-align:center">'+(x.pts||0)+'</div></div>';}h+='</div>';}
h+='<button class="back-btn" onclick="rMore()">← بازگشت</button>';document.getElementById('moc').innerHTML=h;}
function showLang(){var h='<div class="st" style="margin-top:16px">🌐 زبان / Language</div>';
h+='<div class="sg-item glass3" onclick="setLang(\'fa\')"><span class="icon">🇮🇷</span><span class="label">فارسی</span><span class="arrow">'+(curLang==='fa'?'✓':'')+'</span></div>';
h+='<div class="sg-item glass3" onclick="setLang(\'en\')"><span class="icon">🇬🇧</span><span class="label">English</span><span class="arrow">'+(curLang==='en'?'✓':'')+'</span></div>';
h+='<button class="back-btn" onclick="rMore()">← بازگشت</button>';document.getElementById('moc').innerHTML=h;}
function setLang(l){curLang=l;rMore();rFav();rNews();
var labels={fa:{home:'Your Fav',match:'مسابقات',news:'اخبار',more:'بیشتر'},en:{home:'Your Fav',match:'Matches',news:'News',more:'More'}};
document.querySelectorAll('.bl').forEach(function(el){var t=el.getAttribute('data-t');if(t&&labels[l]&&labels[l][t])el.textContent=labels[l][t];});
document.getElementById('si').placeholder=curLang==='en'?'Search team or player...':'🔍 جستجوی تیم یا بازیکن...';}
// SEARCH
var DB={'آرسنال':{i:'آرسنال - لندن | ۱۸۸۶',s:'۱۳ لیگ | ۱۴ جام حذفی | ۲ لیگ قهرمانان',en:'Arsenal'},'لیورپول':{i:'لیورپول - ۱۸۹۲ | آنفیلد',s:'۱۹ لیگ | ۶ لیگ قهرمانان',en:'Liverpool'},'چلسی':{i:'چلسی - ۱۹۰۵',s:'۶ لیگ | ۲ لیگ قهرمانان',en:'Chelsea'},'منچسترسیتی':{i:'منچسترسیتی - ۱۸۸۰',s:'۱۰ لیگ | ۱ لیگ قهرمانان',en:'Manchester City'},'منچستریونایتد':{i:'منچستریونایتد - ۱۸۷۸',s:'۲۰ لیگ | ۳ لیگ قهرمانان',en:'Manchester United'},'رئال مادرید':{i:'رئال مادرید - ۱۹۰۲',s:'۳۶ لالیگا | ۲۰ لیگ قهرمانان',en:'Real Madrid'},'بارسلونا':{i:'بارسلونا - ۱۸۹۹',s:'۲۷ لالیگا | ۵ لیگ قهرمانان',en:'Barcelona'},'اینترمیلان':{i:'اینترمیلان - ۱۹۰۸',s:'۱۹ سری آ | ۳ لیگ قهرمانان',en:'Inter Milan'},'آث میلان':{i:'آث میلان - ۱۸۹۹',s:'۱۹ سری آ | ۷ لیگ قهرمانان',en:'AC Milan'},'یوونتوس':{i:'یوونتوس - ۱۸۹۷',s:'۳۶ سری آ | ۲ لیگ قهرمانان',en:'Juventus'},'بایرن مونیخ':{i:'بایرن مونیخ - ۱۹۰۰',s:'۳۳ بوندس‌لیگا | ۶ لیگ قهرمانان',en:'Bayern Munich'},'پرسپولیس':{i:'پرسپولیس - ۱۳۴۲',s:'۱۶ لیگ ایران | ۲ آسیا',en:'Persepolis'},'استقلال':{i:'استقلال - ۱۳۲۴',s:'۸ لیگ ایران | ۱ آسیا',en:'Esteghlal'},'امباپه':{i:'امباپه - ۱۹۹۸ | رئال مادرید',s:'۴۰+ گل ملی | ۱ جام جهانی',en:'Mbappe'},'هالند':{i:'هالند - ۲۰۰۰ | منچسترسیتی',s:'آقای گل بوندس‌لیگا و PL',en:'Haaland'},'مسی':{i:'مسی - ۱۹۸۷ | اینتر میامی',s:'۸ توپ طلا | ۱ جام جهانی',en:'Messi'},'رونالدو':{i:'رونالدو - ۱۹۸۵ | النصر',s:'۵ توپ طلا | ۱۳۰+ گل ملی',en:'Ronaldo'},'صلاح':{i:'صلاح - ۱۹۹۲ | لیورپول',s:'۳ بار آقای گل PL',en:'Salah'},'آزمون':{i:'آزمون - ۱۹۹۵ | لورکوزن',s:'۵۰+ گل ملی',en:'Azmoun'},'طارمی':{i:'طارمی - ۱۹۹۲ | اینترمیلان',s:'۵۰+ بازی ملی',en:'Taremi'}};
function doSearch(q){var e=document.getElementById('sr');if(!q||q.length<1){e.classList.remove('on');return;}
var ql=q.toLowerCase();var h='';var f=false;for(var k in DB){var v=DB[k];if((k+' '+(v.en||'')+' '+v.i).toLowerCase().indexOf(ql)>-1){h+='<div class="src glass3" onclick="openDetail(\''+k+'\')"><h3>🔍 '+k+'</h3><p>'+v.i+'</p><div>'+v.s.split('|').map(function(x){return'<span class="s">'+x.trim()+'</span>';}).join('')+'</div></div>';f=true;}}
if(!f)h='<div class="empty">نتیجه‌ای نیست</div>';e.innerHTML=h;e.classList.add('on');}
function openDetail(name){var v=DB[name];if(!v)return;
var h='<div style="text-align:center;padding:20px 0">'+(C[name]?'<div class="tl" style="width:80px;height:80px;font-size:32px;margin:0 auto 12px;background:'+C[name]+'">'+name.charAt(0)+'</div>':'')+'<h2 style="font-size:18px">'+name+'</h2><p style="color:rgba(255,255,255,.4);font-size:12px;margin-top:4px">'+v.i+'</p></div>';
h+='<div class="ds2 glass2"><h3>🏆 افتخارات</h3><div class="di2">'+v.s+'</div></div>';
var n=D.football_news||[];var rel=n.filter(function(x){return(x.title+' '+(x.title_en||'')).indexOf(name)>-1||((x.title_en||'').toLowerCase()).indexOf((v.en||'').toLowerCase())>-1;});
if(rel.length>0){h+='<div class="ds2 glass2"><h3>📰 اخبار مرتبط</h3>';for(var i=0;i<Math.min(3,rel.length);i++){h+='<div class="di2"><strong>'+tn(rel[i])+'</strong><br>'+td(rel[i])+'</div>';}h+='</div>';}
document.getElementById('dtB').innerHTML=h;document.getElementById('dtT').textContent=name;document.getElementById('det').classList.add('on');}
// TIMER
var timerSec=60;function tickTimer(){timerSec--;if(timerSec<=0){timerSec=60;load();}var el=document.getElementById('timerNum');if(el)el.textContent=timerSec;}
setInterval(tickTimer,1000);
async function load(){try{var r=await fetch('/data/news.json?'+Date.now());D=await r.json();rFav();rMatch();rNews();rMore();}catch(e){}}
load();setInterval(load,60000);
</script>
</body>
</html>
