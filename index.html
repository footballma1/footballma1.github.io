<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>FootballMA</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Vazirmatn',sans-serif;background:#000;color:#fff;max-width:480px;margin:0 auto;min-height:100vh}
.glass{background:rgba(255,255,255,.06);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08);border-radius:14px}
.hd{padding:12px 16px 8px;position:sticky;top:0;z-index:100;background:#000}
.logo{font-size:20px;font-weight:900;color:#fff}.logo b{color:#3b82f6}
.search{margin-top:8px}
.search input{width:100%;background:#111;border:1px solid #222;border-radius:10px;padding:9px 14px;color:#fff;font-family:'Vazirmatn';font-size:13px;outline:none}
.search input::placeholder{color:#555}
.pg{display:none;padding:0 12px 70px}.pg.on{display:block}
.st{font-size:11px;font-weight:700;color:#555;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.5px}
/* Match */
.mc{background:#111;border-radius:10px;margin-bottom:3px;padding:8px 12px;cursor:pointer}
.mc:active{opacity:.7}
.mc-row{display:flex;align-items:center;padding:3px 0}
.mc-team{display:flex;align-items:center;gap:8px;flex:1}
.tl{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0}
.mc-nm{font-size:13px;font-weight:500}
.mc-ct{text-align:center;min-width:45px}
.mc-tm{font-size:11px;color:#666}
.mc-lg{font-size:9px;color:#555;margin-bottom:2px}
/* Date selector */
.ds{display:flex;gap:4px;overflow-x:auto;padding:6px 0;margin-bottom:8px;-webkit-overflow-scrolling:touch}
.ds::-webkit-scrollbar{display:none}
.di{flex-shrink:0;text-align:center;padding:6px 10px;border-radius:8px;cursor:pointer;background:#111;border:1px solid #222;min-width:55px}
.di.on{background:#fff;color:#000;border-color:#fff}
.di .dw{font-size:8px;color:#666}.di.on .dw{color:#333}
.di .dd{font-size:13px;font-weight:700;margin-top:1px}
.di .dm{font-size:9px;color:#666}.di.on .dm{color:#555}
/* News */
.nf{border-radius:14px;overflow:hidden;cursor:pointer;margin-bottom:10px;position:relative}
.nf img{width:100%;height:200px;object-fit:cover}
.nf .ov{position:absolute;bottom:0;left:0;right:0;padding:14px;background:linear-gradient(transparent,rgba(0,0,0,.9))}
.nf .tg{font-size:10px;color:#3b82f6;font-weight:700}
.nf .tt{font-size:15px;font-weight:700;line-height:1.5;color:#fff}
.nh{display:flex;gap:10px;margin-bottom:6px;padding:8px;border-radius:10px;cursor:pointer;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.05)}
.nh:active{opacity:.7}
.nh img{width:80px;height:60px;border-radius:8px;object-fit:cover;flex-shrink:0}
.nh-body{flex:1;display:flex;flex-direction:column;justify-content:center}
.nh-t{font-size:12px;font-weight:700;line-height:1.5}
.nh-d{font-size:10px;color:#888;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* Search results */
.sr{display:none;margin-bottom:10px}.sr.on{display:block}
.src{background:#111;border-radius:10px;padding:12px;margin-bottom:5px;border-right:3px solid #3b82f6;cursor:pointer}
.src:active{opacity:.7}
.src h3{font-size:14px;font-weight:700;color:#3b82f6;margin-bottom:4px}
.src p{font-size:11px;color:#888;line-height:1.7;margin-bottom:4px}
.src .s{display:inline-block;background:#1a1a1a;padding:2px 6px;border-radius:3px;margin:1px;font-size:9px;color:#60a5fa}
/* Detail page */
.detail{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#000;z-index:200;overflow-y:auto;max-width:480px;margin:0 auto}
.detail.on{display:block}
.dh{background:#0a0a0a;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:201;border-bottom:1px solid #1a1a1a}
.dh button{background:none;color:#3b82f6;border:none;font-size:18px;cursor:pointer}
.dc{padding:16px}
.dt{text-align:center;padding:16px 0;display:flex;justify-content:space-around;align-items:center}
.dt-t{text-align:center;width:80px}
.dt-t .nm{margin-top:6px;font-size:12px;font-weight:700}
.dt-vs{font-size:18px;font-weight:900;color:#3b82f6}
.ds2{background:#111;border-radius:10px;padding:12px;margin-bottom:8px}
.ds2 h3{font-size:12px;font-weight:700;color:#3b82f6;margin-bottom:6px}
.di2{padding:5px 0;border-bottom:1px solid #1a1a1a;font-size:11px;color:#888;line-height:1.7}
.di2:last-child{border:none}
.di2 .l{color:#555;font-size:10px}
/* Favorites */
.fav-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.fav-tag{padding:6px 12px;border-radius:20px;font-size:11px;cursor:pointer;background:#111;color:#888;border:1px solid #333;transition:all .2s}
.fav-tag.on{background:#3b82f6;color:#fff;border-color:#3b82f6}
.fav-tag.g.on{background:#22c55e;border-color:#22c55e}
/* Settings */
.sg{background:#111;border-radius:10px;padding:12px;margin-bottom:8px}
.sg-r{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #1a1a1a}
.sg-r:last-child{border:none}
.tg2{width:40px;height:22px;border-radius:11px;background:#333;position:relative;cursor:pointer}
.tg2.on{background:#3b82f6}
.tg2::after{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:2px;right:2px;transition:right .2s}
.tg2.on::after{right:20px}
.lb{background:#1a1a1a;border:1px solid #333;color:#fff;padding:5px 10px;border-radius:6px;font-family:'Vazirmatn';font-size:11px;cursor:pointer}
.lb.on{background:#3b82f6;color:#fff;border-color:#3b82f6}
/* Nav */
.bn{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:#0a0a0a;border-top:1px solid #1a1a1a;display:flex;z-index:100}
.bi{flex:1;text-align:center;padding:6px 0;cursor:pointer;color:#555}
.bi.on{color:#fff}
.bi svg{width:20px;height:20px;fill:currentColor}
.bi .bl{font-size:9px;margin-top:1px}
.empty{text-align:center;color:#555;padding:20px;font-size:12px}
.about{text-align:center;color:#555;font-size:10px;margin-top:20px}
</style>
</head>
<body>
<div class="hd">
<div class="logo">⚽ Football<b>MA</b><span style="font-size:9px;color:#555;margin-right:4px">v0.0.2</span></div>
<div class="search"><input id="si" placeholder="🔍 جستجوی تیم یا بازیکن..." oninput="doSearch(this.value)"></div>
</div>

<div class="pg on" id="pg-fav"><div id="fvc"></div></div>
<div class="pg" id="pg-match"><div id="dc"></div><div id="mc"></div></div>
<div class="pg" id="pg-news"><div id="nc"></div></div>
<div class="pg" id="pg-set"><div id="sgc"></div></div>
<div class="sr" id="sr"></div>

<div class="detail" id="det"><div class="dh"><button onclick="document.getElementById('det').classList.remove('on')">→</button><span style="font-weight:700;font-size:13px" id="detTitle">جزئیات</span><span></span></div><div class="dc" id="detBody"></div></div>

<div class="bn">
<div class="bi on" data-p="fav"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg><div class="bl">Your Fav</div></div>
<div class="bi" data-p="match"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/></svg><div class="bl">مسابقات</div></div>
<div class="bi" data-p="news"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg><div class="bl">اخبار</div></div>
<div class="bi" data-p="set"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg><div class="bl">تنظیمات</div></div>
</div>

<script>
let D={},selDate=new Date().toISOString().split('T')[0],curLang='fa';
const C={'آرسنال':'#EF0107','لیورپول':'#C8102E','چلسی':'#034694','منچسترسیتی':'#6CABDD','منچستریونایتد':'#DA291C','تاتنهام':'#132257','نیوکاسل':'#241F20','استون ویلا':'#670E36','رئال مادرید':'#FEBE10','بارسلونا':'#A50044','اتلتیکو مادرید':'#CB3524','اینترمیلان':'#010E80','آث میلان':'#FB090B','ناپولی':'#12A0D7','یوونتوس':'#000','آتالانتا':'#1E71B8','آ اس رم':'#8E1F2F','بایرن مونیخ':'#DC052D','دورتموند':'#FDE100','لورکوزن':'#E32221','پاریسن‌ژرمن':'#004170','مارسی':'#2FAEE0','پرسپولیس':'#D4003C','استقلال':'#003DA5','سپاهان':'#FFD700','تراکتور':'#D4003C'};
function tl(t,s){s=s||22;return '<div class="tl" style="width:'+s+'px;height:'+s+'px;background:'+(C[t]||'#333')+';font-size:'+(s*.45)+'px">'+t.charAt(0)+'</div>';}
function tn(x){return curLang==='en'?(x.title_en||x.title):x.title;}
function td(x){return curLang==='en'?(x.desc_en||x.desc):x.desc;}

document.querySelectorAll('.bi').forEach(b=>{b.onclick=()=>{
document.querySelectorAll('.bi').forEach(x=>x.classList.remove('on'));b.classList.add('on');
document.querySelectorAll('.pg').forEach(p=>p.classList.remove('on'));
document.getElementById('pg-'+b.dataset.p).classList.add('on');
document.getElementById('sr').classList.remove('on');
if(b.dataset.p==='fav')rFav();
}});

// Favorites
const FAV='fm_fav';
function gf(){try{return JSON.parse(localStorage.getItem(FAV))||{teams:[],players:[]};}catch(e){return{teams:[],players:[]};}}
function sf(f){localStorage.setItem(FAV,JSON.stringify(f));}
function togTeam(t){const f=gf();const i=f.teams.indexOf(t);i>-1?f.teams.splice(i,1):f.teams.push(t);sf(f);rFav();}
function togPlayer(p){const f=gf();const i=f.players.indexOf(p);i>-1?f.players.splice(i,1):f.players.push(p);sf(f);rFav();}

const ALL_T=['آرسنال','لیورپول','چلسی','منچسترسیتی','منچستریونایتد','تاتنهام','نیوکاسل','استون ویلا','رئال مادرید','بارسلونا','اتلتیکو مادرید','اینترمیلان','آث میلان','یوونتوس','ناپولی','بایرن مونیخ','دورتموند','لورکوزن','پاریسن‌ژرمن','مارسی','پرسپولیس','استقلال','سپاهان','تراکتور'];
const ALL_P=['امباپه','هالند','مسی','رونالدو','بنزما','صلاح','آزمون','طارمی','جهانبخش'];

function rFav(){
const f=gf(),n=D.football_news||[],fx=D.fixtures||[];
let h='<div class="st">⭐ تیم مورد علاقه</div><div class="fav-tags">';
ALL_T.forEach(t=>{h+='<div class="fav-tag'+(f.teams.includes(t)?' on':'')+'" onclick="togTeam(\''+t+'\')">'+t+'</div>';});
h+='</div><div class="st">⭐ بازیکن مورد علاقه</div><div class="fav-tags">';
ALL_P.forEach(p=>{h+='<div class="fav-tag g'+(f.players.includes(p)?' on':'')+'" onclick="togPlayer(\''+p+'\')">'+p+'</div>';});
h+='</div>';
if(f.teams.length&&n.length){h+='<div class="st">📰 اخبار تیم‌های مورد علاقه</div>';
const fn=n.filter(x=>f.teams.some(t=>(x.title+' '+(x.title_en||'')).includes(t)));
if(fn.length)fn.slice(0,4).forEach(x=>{const img=x.img?'<img src="'+x.img+'" onerror="this.style.display=\'none\'">':'';h+='<div class="nh" onclick="oN(this)" data-i="'+n.indexOf(x)+'">'+img+'<div class="nh-body"><div class="nh-t">'+tn(x)+'</div><div class="nh-d">'+td(x)+'</div></div></div>';});
else h+='<div style="color:#555;font-size:12px;padding:10px">خبری نیست</div>';}
if(f.teams.length&&fx.length){h+='<div class="st">🏟️ بازی‌های تیم‌های مورد علاقه</div>';
const fm=fx.filter(m=>f.teams.some(t=>m.home.includes(t)||m.away.includes(t)));
if(fm.length)fm.slice(0,4).forEach(m=>{h+='<div class="mc"><div class="mc-lg">'+m.league+'</div><div class="mc-row"><div class="mc-team">'+tl(m.home)+'<div class="mc-nm">'+m.home+'</div></div><div class="mc-ct"><div class="mc-tm">'+m.time+'</div></div><div class="mc-team" style="justify-content:flex-end"><div class="mc-nm">'+m.away+'</div>'+tl(m.away)+'</div></div></div>';});
else h+='<div style="color:#555;font-size:12px;padding:10px">بازی‌ای نیست</div>';}
document.getElementById('fvc').innerHTML=h;
}

// Matches
function rMatch(){
const fxd=D.fixtures_by_date||{};
const dates=Object.keys(fxd).sort();
if(!dates.length){document.getElementById('mc').innerHTML='<div class="empty">بازی نداریم</div>';return;}
let dh='<div class="ds">';
dates.forEach(d=>{const dt=new Date(d+'T00:00:00');const wd=['ی','س','چ','پ','ج','ش','ی'][dt.getDay()];dh+='<div class="di'+(d===selDate?' on':'')+'" onclick="selDate=\''+d+'\';rMatch()"><div class="dw">'+wd+'</div><div class="dd">'+dt.getDate()+'</div><div class="dm">'+(dt.getMonth()+1)+'/'+dt.getDate()+'</div></div>';});
dh+='</div>';document.getElementById('dc').innerHTML=dh;
const info=fxd[selDate];if(!info||!info.matches.length){document.getElementById('mc').innerHTML='<div class="empty">بازی مهمی نیست</div>';return;}
const g={};info.matches.forEach(m=>{if(!g[m.league])g[m.league]=[];g[m.league].push(m);});
let h='';for(const[l,ms] of Object.entries(g)){h+='<div class="st">'+l+'</div>';ms.forEach(m=>{h+='<div class="mc" onclick="oMatch(\''+m.home+'|'+m.away+'|'+m.league+'|'+m.time+'\')"><div class="mc-lg">'+m.league+'</div><div class="mc-row"><div class="mc-team">'+tl(m.home)+'<div class="mc-nm">'+m.home+'</div></div><div class="mc-ct"><div class="mc-tm">'+m.time+'</div></div><div class="mc-team" style="justify-content:flex-end"><div class="mc-nm">'+m.away+'</div>'+tl(m.away)+'</div></div></div>';});}
document.getElementById('mc').innerHTML=h;
}

function oMatch(d){const[home,away,league,time]=d.split('|');
const rel=(D.football_news||[]).filter(x=>(x.title+' '+(x.title_en||'')).includes(home)||(x.title+' '+(x.title_en||'')).includes(away));
let h='<div class="dt"><div class="dt-t">'+tl(home,50)+'<div class="nm">'+home+'</div></div><div class="dt-vs">VS</div><div class="dt-t">'+tl(away,50)+'<div class="nm">'+away+'</div></div></div>';
h+='<div class="ds2"><h3>📋 اطلاعات بازی</h3><div class="di2"><span class="l">🏆 لیگ:</span> '+league+'</div><div class="di2"><span class="l">⏰ ساعت:</span> '+time+' (تهران)</div><div class="di2"><span class="l">🏠 میزبان:</span> '+home+'</div><div class="di2"><span class="l">✈️ مهمان:</span> '+away+'</div></div>';
if(rel.length){h+='<div class="ds2"><h3>📰 اخبار مرتبط</h3>';rel.slice(0,3).forEach(x=>{h+='<div class="di2"><strong>'+tn(x)+'</strong><br>'+td(x)+'</div>';});h+='</div>';}
document.getElementById('detBody').innerHTML=h;document.getElementById('detTitle').textContent=home+' vs '+away;document.getElementById('det').classList.add('on');
}

// News
function rNews(){
const n=D.football_news||[],tr=D.transfers||[];
if(!n.length){document.getElementById('nc').innerHTML='<div class="empty">خبری نیست</div>';return;}
let h='';
if(n[0]){const x=n[0];h+='<div class="nf glass" onclick="oN(0)">'+(x.img?'<img src="'+x.img+'" onerror="this.style.display=\'none\'">':'')+'<div class="ov"><div class="tg">📰 '+(curLang==='en'?'Featured':'خبر ویژه')+'</div><div class="tt">'+tn(x)+'</div></div></div>';}
n.slice(1,8).forEach((x,i)=>{const img=x.img?'<img src="'+x.img+'" loading="lazy" onerror="this.style.display=\'none\'">':'';h+='<div class="nh" onclick="oN('+(i+1)+')">'+img+'<div class="nh-body"><div class="nh-t">'+tn(x)+'</div><div class="nh-d">'+td(x)+'</div></div></div>';});
if(tr.length){h+='<div class="st">🔄 '+(curLang==='en'?'Transfers':'نقل و انتقالات')+'</div>';tr.slice(0,5).forEach((x,i)=>{const img=x.img?'<img src="'+x.img+'" loading="lazy" onerror="this.style.display=\'none\'">':'';h+='<div class="nh glass" onclick="oN('+(8+i)+')">'+img+'<div class="nh-body"><div class="nh-t">'+tn(x)+'</div><div class="nh-d">'+td(x)+'</div></div></div>';});}
document.getElementById('nc').innerHTML=h;
}
function oN(i){const all=[...(D.football_news||[]),...(D.transfers||[])];const n=all[i];if(!n)return;
let h='';if(n.img)h+='<img src="'+n.img+'" style="width:100%;max-height:250px;object-fit:cover;border-radius:10px;margin-bottom:10px" onerror="this.style.display=\'none\'">';
h+='<h2 style="font-size:16px;line-height:1.7;margin-bottom:8px">'+tn(n)+'</h2><p style="font-size:12px;color:#888;line-height:2">'+td(n)+'</p>';
document.getElementById('detBody').innerHTML=h;document.getElementById('detTitle').textContent='خبر کامل';document.getElementById('det').classList.add('on');
}

// Settings
function rSet(){let h='<div class="st" style="margin-top:14px">تنظیمات</div><div class="sg">';
h+='<div class="sg-r"><div><b style="font-size:12px">🌐 زبان / Language</b></div><div><button class="lb'+(curLang==='fa'?' on':'')+'" onclick="setLang(\'fa\')">فارسی</button> <button class="lb'+(curLang==='en'?' on':'')+'" onclick="setLang(\'en\')">English</button></div></div>';
h+='</div><div class="about">FootballMA v0.0.2<br>Made in Alireza 🔥</div>';document.getElementById('sgc').innerHTML=h;}
function setLang(l){curLang=l;rSet();rNews();rFav();}

// Search
const DB={'آرسنال':{'i':'آرسنال - لندن | ۱۸۸۶ | امارات','s':'🏆 ۱۳ لیگ | ۱۴ جام حذفی | ۲ لیگ قهرمانان | ۱۷ جام اتحادیه','en':'Arsenal'},

function doSearch(q){const e=document.getElementById('sr');
if(!q||q.length<1){e.classList.remove('on');return;}
const ql=q.toLowerCase();let h='';let f=false;
for(const[k,v] of Object.entries(DB)){const s=(k+' '+(v.en||'')+' '+v.i).toLowerCase();if(s.includes(ql)){h+='<div class="src" onclick="openDetail(\''+k+'\')"><h3>🔍 '+k+'</h3><p>'+v.i+'</p><div>'+v.s.split('|').map(x=>'<span class="s">'+x.trim()+'</span>').join('')+'</div></div>';f=true;}}
if(!f)h='<div class="empty">نتیجه‌ای نیست</div>';e.innerHTML=h;e.classList.add('on');}

function openDetail(name){const v=DB[name];if(!v)return;
let h='<div style="text-align:center;padding:20px 0">'+(C[name]?'<div class="tl" style="width:80px;height:80px;font-size:32px;margin:0 auto 12px;background:'+C[name]+'">'+name.charAt(0)+'</div>':'')+'<h2 style="font-size:18px">'+name+'</h2><p style="color:#888;font-size:12px;margin-top:4px">'+v.i+'</p></div>';
h+='<div class="ds2"><h3>🏆 افتخارات</h3>';
v.s.split('|').forEach(s=>{h+='<div class="di2">'+s.trim()+'</div>';});
h+='</div>';
// Related news
const n=D.football_news||[];
const rel=n.filter(x=>(x.title+' '+(x.title_en||'')).includes(name)||(x.title+' '+(x.title_en||'')).includes(v.en||''));
if(rel.length){h+='<div class="ds2"><h3>📰 اخبار مرتبط</h3>';rel.slice(0,3).forEach(x=>{h+='<div class="di2"><strong>'+tn(x)+'</strong><br>'+td(x)+'</div>';});h+='</div>';}
document.getElementById('detBody').innerHTML=h;document.getElementById('detTitle').textContent=name;document.getElementById('det').classList.add('on');}

async function load(){try{const r=await fetch('/data/news.json?'+Date.now());D=await r.json();rFav();rMatch();rNews();rSet();}catch(e){}}
load();setInterval(load,60000);
</script>
