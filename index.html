<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0e1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FootballMA</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png" sizes="192x192">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0e1a;color:#e5e7eb;min-height:100vh;overflow-x:hidden;-webkit-user-select:none;user-select:none}
.hdr{position:sticky;top:0;z-index:100;background:rgba(10,14,26,0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,0.08)}
.logo{font-size:22px;font-weight:800;color:#3b82f6;letter-spacing:-0.5px}
.lang-btns{display:flex;gap:6px}
.lang-btn{padding:5px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.15);background:transparent;color:#9ca3af;font-size:13px;cursor:pointer}
.lang-btn.active{background:#3b82f6;color:#fff;border-color:#3b82f6}
.tabs{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(10,14,26,0.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,0.08);z-index:100;padding:6px 0 env(safe-area-inset-bottom,8px)}
.tab{flex:1;text-align:center;padding:6px 0;cursor:pointer;color:#6b7280;font-size:11px;transition:color 0.2s}
.tab.active{color:#3b82f6}
.tab-icon{font-size:20px;display:block;margin-bottom:2px}
.content{padding:12px 12px 80px;max-width:480px;margin:0 auto}
.card{background:rgba(255,255,255,0.05);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:14px;margin-bottom:10px}
.card:hover{background:rgba(255,255,255,0.08)}
.st{font-size:13px;font-weight:700;color:#9ca3af;margin:16px 0 8px;padding-right:4px}
.match{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:12px;cursor:pointer;background:rgba(255,255,255,0.03);margin-bottom:6px;border:1px solid rgba(255,255,255,0.05)}
.match:hover{background:rgba(59,130,246,0.1);border-color:rgba(59,130,246,0.2)}
.mt{font-size:13px;text-align:center;min-width:44px}
.mt.live{color:#22c55e;font-weight:700}
.mt.ft{color:#6b7280}
.tm{display:flex;align-items:center;gap:8px;flex:1}
.tm.aw{justify-content:flex-end}
.tm img{width:24px;height:24px;border-radius:50%;object-fit:cover}
.tn{font-size:14px;font-weight:500}
.news-big{position:relative;border-radius:16px;overflow:hidden;margin-bottom:10px;cursor:pointer}
.news-big img{width:100%;height:200px;object-fit:cover}
.news-big .ov{position:absolute;bottom:0;left:0;right:0;padding:14px;background:linear-gradient(transparent,rgba(0,0,0,0.9))}
.news-big .ov .tl{font-size:16px;font-weight:700;color:#fff;line-height:1.4}
.news-sm{display:flex;gap:10px;padding:10px;border-radius:12px;cursor:pointer;background:rgba(255,255,255,0.03);margin-bottom:6px;border:1px solid rgba(255,255,255,0.05)}
.news-sm img{width:80px;height:60px;border-radius:8px;object-fit:cover;flex-shrink:0}
.news-sm .tx{flex:1}
.news-sm .tx .tl{font-size:13px;font-weight:600;line-height:1.5;color:#e5e7eb}
.news-sm .tx .ds{font-size:11px;color:#6b7280;margin-top:4px;line-height:1.4}
.news-sm .tx .src{font-size:10px;color:#3b82f6;margin-top:4px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
.row img{width:36px;height:36px;border-radius:50%;object-fit:cover}
.rk{font-size:13px;font-weight:700;width:24px;text-align:center;color:#6b7280}
.tm-name{flex:1;font-size:13px;font-weight:500}
.pts{font-size:13px;font-weight:700;width:30px;text-align:center;color:#3b82f6}
.tr-card{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:rgba(255,255,255,0.03);margin-bottom:6px;border:1px solid rgba(255,255,255,0.05)}
.tr-card img{width:40px;height:40px;border-radius:50%;object-fit:cover}
.tr-arrow{color:#3b82f6;font-size:16px}
.empty{text-align:center;padding:40px 20px;color:#6b7280}
.btn-more{display:block;width:100%;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.1);background:rgba(59,130,246,0.15);color:#3b82f6;font-size:14px;font-weight:600;cursor:pointer;text-align:center;margin-top:10px}
.search-box{width:100%;padding:12px 16px;border-radius:12px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);color:#e5e7eb;font-size:14px;direction:rtl;margin-bottom:12px}
.search-box::placeholder{color:#6b7280}
.league-card{border-radius:16px;overflow:hidden;margin-bottom:10px;border:1px solid rgba(255,255,255,0.08);cursor:pointer}
.league-hdr{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:14px;color:#fff}
.league-hdr .arr{font-size:12px;transition:transform 0.3s}
.league-hdr .arr.open{transform:rotate(180deg)}
.league-teams{max-height:0;overflow:hidden;transition:max-height 0.4s ease}
.league-teams.open{max-height:2000px}
.timer-box{text-align:center;padding:20px}
.timer-num{font-size:48px;font-weight:800;color:#3b82f6}
.timer-lbl{font-size:12px;color:#6b7280;margin-top:4px}
.about{text-align:center;padding:20px;color:#6b7280;font-size:12px;line-height:1.6}
.logos{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:10px}
.logos img{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,0.1)}
.logos img.fav{border-color:#f59e0b}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.content>*{animation:fade 0.3s ease}
</style>
</head>
<body>

<div class="hdr">
  <div class="logo">FootballMA</div>
  <div class="lang-btns">
    <button class="lang-btn active" onclick="setLang('fa')">فارسی</button>
    <button class="lang-btn" onclick="setLang('en')">English</button>
  </div>
</div>

<div class="content" id="content"></div>

<div class="tabs">
  <div class="tab active" onclick="showTab('fav')"><span class="tab-icon">⭐</span><span id="tFav">علاقه‌مندی</span></div>
  <div class="tab" onclick="showTab('search')"><span class="tab-icon">🔍</span><span id="tSearch">جستجو</span></div>
  <div class="tab" onclick="showTab('matches')"><span class="tab-icon">⚽</span><span id="tMatches">بازی‌ها</span></div>
  <div class="tab" onclick="showTab('news')"><span class="tab-icon">📰</span><span id="tNews">اخبار</span></div>
  <div class="tab" onclick="showTab('more')"><span class="tab-icon">⋯</span><span id="tMore">بیشتر</span></div>
</div>

<script>
var D={};
var curLang='fa';
var curTab='fav';
var newsShow=6;

var L={};
L.fav='علاقه‌مندی';L.search='جستجو';L.matches='بازی‌ها';L.news='اخبار';L.more='بیشتر';
L.standings='جدول';L.transfers='نقل و انتقالات';L.leagues='لیگ‌ها';
L.world='اخبار جهان';L.timer='زمان تا آپدیت بعدی';L.about='FootballMA - ساخته شده با ❤️';
L.noFav='تیمی انتخاب نکردید';L.noNews='خبری نیست';L.loadMore='ادامه اخبار';
L.searchHint='جستجوی تیم، بازیکن...';L.allTeams='همه تیم‌ها';L.allLeagues='همه لیگ‌ها';
L.home='میزبان';L.away='مهمان';L.live='زنده';L.ft='پایان';L.fixtures='برنامه بازی‌ها';

var TEAMS={'آرسنال':'#EF0107','لیورپول':'#C8102E','چلسی':'#034694','منچسترسیتی':'#6CABDD','منچستریونایتد':'#DA291C','تاتنهام':'#132257','نیوکاسل':'#241F20','استون ویلا':'#670E36','وستهام':'#7A263A','برایتون':'#0057B8','رئال مادرید':'#FEBE10','بارسلونا':'#A50044','اتلتیکو مادرید':'#CB3524','اینترمیلان':'#010E80','آث میلان':'#FB090B','یوونتوس':'#000000','ناپولی':'#12A0D7','آ اس رم':'#8E1F2F','آتالانتا':'#1E71B8','بایرن مونیخ':'#DC052D','دورتموند':'#FDE100','لورکوزن':'#E32221','لایپزیگ':'#DD0741','پاریسن‌ژرمن':'#004170','مارسی':'#2FAEE0','موناکو':'#E31937','لیل':'#E30613','پرسپولیس':'#CC0000','استقلال':'#003399','سپاهان':'#FFD700','تراکتور':'#CC0000','سویا':'#D4001E','رئال سوسیداد':'#003DA5','لاتزیو':'#87D8F7','لایپزیگ':'#DD0741'};

var LOGOS={
'آرسنال':'https://upload.wikimedia.org/wikipedia/en/5/53/Arsenal_FC.svg',
'لیورپول':'https://upload.wikimedia.org/wikipedia/en/0/0c/Liverpool_FC.svg',
'چلسی':'https://upload.wikimedia.org/wikipedia/en/c/cc/Chelsea_FC.svg',
'منچسترسیتی':'https://upload.wikimedia.org/wikipedia/en/e/eb/Manchester_City_FC_badge.svg',
'منچستریونایتد':'https://upload.wikimedia.org/wikipedia/en/7/7a/Manchester_United_FC_crest.svg',
'تاتنهام':'https://upload.wikimedia.org/wikipedia/en/b/b4/Tottenham_Hotspur.svg',
'نیوکاسل':'https://upload.wikimedia.org/wikipedia/en/5/56/Newcastle_United_Logo.svg',
'استون ویلا':'https://upload.wikimedia.org/wikipedia/en/9/9a/Aston_Villa_FC_logo_(2023).svg',
'رئال مادرید':'https://upload.wikimedia.org/wikipedia/en/5/56/Real_Madrid_CF.svg',
'بارسلونا':'https://upload.wikimedia.org/wikipedia/en/4/47/FC_Barcelona_(crest).svg',
'اتلتیکو مادرید':'https://upload.wikimedia.org/wikipedia/en/1/1d/Atletico_Madrid_logo_(2024).svg',
'اینترمیلان':'https://upload.wikimedia.org/wikipedia/en/0/05/Inter_Milano_Logo.svg',
'آث میلان':'https://upload.wikimedia.org/wikipedia/en/d/d0/AC_Milan_(crest).svg',
'یوونتوس':'https://upload.wikimedia.org/wikipedia/en/b/bc/Juventus_Turin_2017_logo.svg',
'ناپولی':'https://upload.wikimedia.org/wikipedia/en/2/20/SSC_Napoli_logo_(2024).svg',
'آ اس رم':'https://upload.wikimedia.org/wikipedia/en/3/3b/AS_Roma_logo_(2017).svg',
'آتالانتا':'https://upload.wikimedia.org/wikipedia/en/5/58/Atalanta_BC_logo_(2021).svg',
'بایرن مونیخ':'https://upload.wikimedia.org/wikipedia/en/1/1b/FC_Bayern_M%C3%BCnchen_logo_(2017).svg',
'دورتموند':'https://upload.wikimedia.org/wikipedia/en/6/67/Borussia_Dortmund_logo.svg',
'لورکوزن':'https://upload.wikimedia.org/wikipedia/en/5/59/Bayer_04_Leverkusen_logo.svg',
'پاریسن‌ژرمن':'https://upload.wikimedia.org/wikipedia/en/7/77/Paris_Saint-Germain_F.C..svg',
'مارسی':'https://upload.wikimedia.org/wikipedia/en/d/d5/Olympique_de_Marseille_logo.svg',
'پرسپولیس':'https://upload.wikimedia.org/en/6/61/Persepolis_F.C._Logo.png',
'استقلال':'https://upload.wikimedia.org/en/a/a2/Esteghlal_Te.png',
'سپاهان':'https://upload.wikimedia.org/en/9/90/Sepahan_SC_logo.png',
'سویا':'https://upload.wikimedia.org/wikipedia/en/6/6c/Sevilla_FC_logo.svg',
'رئال سوسیداد':'https://upload.wikimedia.org/wikipedia/en/8/88/Real_Sociedad_club_crest.svg',
'لاتزیو':'https://upload.wikimedia.org/wikipedia/en/0/04/S.S._Lazio_logo_(2024).svg',
'لایپزیگ':'https://upload.wikimedia.org/wikipedia/en/e/e1/RB_Leipzig_2014_logo.svg',
'موناکو':'https://upload.wikimedia.org/wikipedia/en/7/76/AS_Monaco_FC_logo.svg',
'لیل':'https://upload.wikimedia.org/wikipedia/en/8/86/LOSC_Lille_logo.svg',
'وستهام':'https://upload.wikimedia.org/wikipedia/en/c/c2/West_Ham_United_FC.svg',
'برایتون':'https://upload.wikimedia.org/wikipedia/en/f/fd/Brighton_%26_Hove_Albion_logo.svg',
'تراکتور':'https://upload.wikimedia.org/en/1/10/Tractor_S.C._logo.png'
};

function tl(name, size) {
  size = size || 28;
  var bg = TEAMS[name] || '#333';
  if (LOGOS[name]) {
    return '<img src="' + LOGOS[name] + '" style="width:' + size + 'px;height:' + size + 'px;border-radius:50%;object-fit:cover" onerror="this.style.display=\'none\';this.parentNode.innerHTML=\'<div class=tl style=\''+bg+'\'>' + name.charAt(0) + '</div>\'">';
  }
  return '<div style="width:' + size + 'px;height:' + size + 'px;border-radius:50%;background:' + bg + ';display:flex;align-items:center;justify-content:center;color:#fff;font-size:' + (size * 0.4) + 'px;font-weight:700">' + name.charAt(0) + '</div>';
}

function tn(item) {
  if (curLang === 'en' && item.title_en) return item.title_en;
  return item.title || '';
}
function td(item) {
  if (curLang === 'en' && item.desc_en) return item.desc_en;
  return item.desc || '';
}

function gf() {
  try { return JSON.parse(localStorage.getItem('fm_fav')) || []; } catch(e) { return []; }
}
function sf(f) { localStorage.setItem('fm_fav', JSON.stringify(f)); }
function isFav(team) { return gf().indexOf(team) >= 0; }
function toggleFav(team) {
  var f = gf();
  var i = f.indexOf(team);
  if (i >= 0) f.splice(i, 1); else f.push(team);
  sf(f);
  render();
}

function showTab(t) {
  curTab = t;
  document.querySelectorAll('.tab').forEach(function(el, i) {
    el.classList.toggle('active', ['fav','search','matches','news','more'][i] === t);
  });
  render();
}

function render() {
  if (curTab === 'fav') renderFav();
  else if (curTab === 'search') renderSearch();
  else if (curTab === 'matches') renderMatches();
  else if (curTab === 'news') renderNews();
  else renderMore();
}

function renderFav() {
  var fav = gf();
  var news = D.football_news || [];
  var h = '';
  if (fav.length === 0) {
    h += '<div class="empty">' + L.noFav + '</div>';
  } else {
    h += '<div class="st">' + L.fav + '</div>';
    h += '<div class="logos">';
    fav.forEach(function(t) {
      h += '<div onclick="toggleFav(\'' + t + '\')" title="' + t + '">' + tl(t, 48) + '</div>';
    });
    h += '</div>';
    fav.forEach(function(team) {
      var teamNews = news.filter(function(n) {
        return (n.title && n.title.indexOf(team) >= 0) || (n.title_en && n.title_en.indexOf(team) >= 0);
      });
      if (teamNews.length > 0) {
        h += '<div class="st">' + team + '</div>';
        teamNews.slice(0, 3).forEach(function(n) {
          h += renderNewsCard(n);
        });
      }
    });
  }
  document.getElementById('content').innerHTML = h;
}

function renderSearch() {
  var h = '<input class="search-box" placeholder="' + L.searchHint + '" oninput="doSearch(this.value)">';
  h += '<div id="searchResults"></div>';
  document.getElementById('content').innerHTML = h;
}

function doSearch(q) {
  if (!q || q.length < 1) {
    document.getElementById('searchResults').innerHTML = '';
    return;
  }
  var news = D.football_news || [];
  var h = '<div class="st">' + L.allTeams + '</div>';
  var teams = Object.keys(TEAMS);
  var found = teams.filter(function(t) { return t.indexOf(q) >= 0; });
  found.forEach(function(t) {
    var f = isFav(t);
    h += '<div class="match" onclick="toggleFav(\'' + t + '\')">';
    h += '<div class="tm">' + tl(t, 30) + '<span class="tn">' + t + '</span></div>';
    h += '<span style="font-size:18px">' + (f ? '⭐' : '☆') + '</span>';
    h += '</div>';
  });
  var matched = news.filter(function(n) {
    return (n.title && n.title.indexOf(q) >= 0) || (n.title_en && n.title_en.indexOf(q) >= 0);
  });
  if (matched.length > 0) {
    h += '<div class="st">' + L.news + '</div>';
    matched.slice(0, 5).forEach(function(n) { h += renderNewsCard(n); });
  }
  document.getElementById('searchResults').innerHTML = h;
}

function renderMatches() {
  var fxd = D.fixtures_by_date || {};
  var dates = Object.keys(fxd).sort();
  var h = '<div class="st">' + L.fixtures + '</div>';
  if (dates.length === 0) {
    h += '<div class="empty">' + L.noNews + '</div>';
  }
  dates.forEach(function(d) {
    var matches = fxd[d].matches || [];
    if (matches.length === 0) return;
    h += '<div class="st">' + d + '</div>';
    matches.forEach(function(m) {
      var timeClass = '';
      if (m.time === L.live || m.time === '● زنده') timeClass = ' live';
      else if (m.time && m.time.indexOf('-') >= 0) timeClass = ' ft';
      h += '<div class="match">';
      h += '<div class="tm">' + tl(m.home, 24) + '<span class="tn">' + m.home + '</span></div>';
      h += '<div class="mt' + timeClass + '">' + (m.time || '') + '</div>';
      h += '<div class="tm aw"><span class="tn">' + m.away + '</span>' + tl(m.away, 24) + '</div>';
      h += '</div>';
    });
  });
  document.getElementById('content').innerHTML = h;
}

function renderNewsCard(n) {
  var img = n.img || '';
  var title = tn(n);
  var desc = td(n);
  if (img) {
    return '<div class="news-big"><img src="' + img + '" loading="lazy"><div class="ov"><div class="tl">' + title + '</div></div></div>';
  }
  return '<div class="news-sm"><div class="tx"><div class="tl">' + title + '</div><div class="ds">' + (desc ? desc.substring(0, 100) : '') + '</div></div></div>';
}

function renderNews() {
  var news = D.football_news || [];
  var transfers = D.transfers || [];
  var h = '';
  if (news.length === 0) {
    h += '<div class="empty">' + L.noNews + '</div>';
  } else {
    if (news[0]) h += renderNewsCard(news[0]);
    for (var i = 1; i < Math.min(newsShow, news.length); i++) {
      h += renderNewsCard(news[i]);
    }
    if (newsShow < news.length) {
      h += '<button class="btn-more" onclick="loadMoreNews()">' + L.loadMore + ' (' + (news.length - newsShow) + ')</button>';
    }
  }
  if (transfers.length > 0) {
    h += '<div class="st">🔄 ' + L.transfers + '</div>';
    transfers.forEach(function(t) {
      h += '<div class="tr-card">';
      h += tl(t.player || '?', 40);
      h += '<div style="flex:1"><div style="font-weight:600;font-size:13px">' + (t.player || '?') + '</div>';
      h += '<div style="font-size:11px;color:#6b7280">' + (t.from || '') + ' → ' + (t.to || '') + '</div></div>';
      h += '</div>';
    });
  }
  document.getElementById('content').innerHTML = h;
}

function loadMoreNews() {
  newsShow = Math.min(newsShow + 6, (D.football_news || []).length);
  renderNews();
}

function renderMore() {
  var leagues = D.standings || {};
  var world = D.world_news || [];
  var h = '';

  h += '<div class="timer-box"><div class="timer-num" id="timerNum">60s</div><div class="timer-lbl">' + L.timer + '</div></div>';

  h += '<div class="st">' + L.leagues + '</div>';
  var leagueNames = Object.keys(leagues);
  var leagueColors = {
    'لیگ برتر انگلیس': '#3d195b', 'لالیگا اسپانیا': '#ee8707', 'سری آ ایتالیا': '#024494',
    'بوندس‌لیگا آلمان': '#d20515', 'لیگ ۱ فرانسه': '#091c3e', 'لیگ ایران': '#006633'
  };
  leagueNames.forEach(function(name) {
    var teams = leagues[name] || [];
    var color = leagueColors[name] || '#1a1a2e';
    var isOpen = false;
    h += '<div class="league-card" id="lc_' + name.replace(/\s/g,'') + '">';
    h += '<div class="league-hdr" style="background:' + color + '" onclick="toggleLeague(\'' + name + '\')">';
    h += '<span>' + name + '</span><span class="arr" id="la_' + name.replace(/\s/g,'') + '">▼</span></div>';
    h += '<div class="league-teams" id="lt_' + name.replace(/\s/g,'') + '">';
    h += '<div style="padding:8px 14px">';
    h += '<div class="row"><div class="rk">#</div><div style="flex:1;font-size:12px;color:#6b7280">تیم</div><div class="pts" style="color:#6b7280">امتیاز</div></div>';
    teams.forEach(function(team, idx) {
      h += '<div class="row">';
      h += '<div class="rk">' + (idx + 1) + '</div>';
      h += '<div class="tm" style="flex:1">' + tl(team.name, 24) + '<span class="tm-name">' + team.name + '</span></div>';
      h += '<div class="pts">' + (team.pts || 0) + '</div>';
      h += '</div>';
    });
    h += '</div></div></div>';
  });

  if (world.length > 0) {
    h += '<div class="st">' + L.world + '</div>';
    world.slice(0, 5).forEach(function(n) {
      var img = n.img || '';
      if (img) {
        h += '<div class="news-big"><img src="' + img + '" loading="lazy"><div class="ov"><div class="tl">' + tn(n) + '</div></div></div>';
      } else {
        h += '<div class="news-sm"><div class="tx"><div class="tl">' + tn(n) + '</div></div></div>';
      }
    });
  }

  h += '<div class="about">' + L.about + '</div>';
  document.getElementById('content').innerHTML = h;
  startTimer();
}

function toggleLeague(name) {
  var key = name.replace(/\s/g, '');
  var el = document.getElementById('lt_' + key);
  var arr = document.getElementById('la_' + key);
  if (el) {
    el.classList.toggle('open');
    if (arr) arr.classList.toggle('open');
  }
}

var TS_KEY = 'fm_ts';
function startTimer() {
  var last = parseInt(localStorage.getItem(TS_KEY) || '0');
  if (!last) {
    last = Date.now();
    localStorage.setItem(TS_KEY, last);
  }
  function tick() {
    last = parseInt(localStorage.getItem(TS_KEY) || Date.now());
    var diff = Math.floor((Date.now() - last) / 1000);
    var remain = Math.max(0, 60 - (diff % 60));
    var el = document.getElementById('timerNum');
    if (el) el.textContent = remain + 's';
    if (remain <= 0) {
      localStorage.setItem(TS_KEY, Date.now());
      loadData();
    }
  }
  setInterval(tick, 1000);
  tick();
}

function setLang(l) {
  curLang = l;
  document.querySelectorAll('.lang-btn').forEach(function(b) {
    b.classList.toggle('active', b.textContent.trim() === (l === 'fa' ? 'فارسی' : 'English'));
  });
  L.fav = l === 'fa' ? 'علاقه‌مندی' : 'Favorites';
  L.search = l === 'fa' ? 'جستجو' : 'Search';
  L.matches = l === 'fa' ? 'بازی‌ها' : 'Matches';
  L.news = l === 'fa' ? 'اخبار' : 'News';
  L.more = l === 'fa' ? 'بیشتر' : 'More';
  L.standings = l === 'fa' ? 'جدول' : 'Standings';
  L.transfers = l === 'fa' ? 'نقل و انتقالات' : 'Transfers';
  L.leagues = l === 'fa' ? 'لیگ‌ها' : 'Leagues';
  L.world = l === 'fa' ? 'اخبار جهان' : 'World News';
  L.timer = l === 'fa' ? 'زمان تا آپدیت بعدی' : 'Time to next update';
  L.about = 'FootballMA';
  L.noFav = l === 'fa' ? 'تیمی انتخاب نکردید' : 'No teams selected';
  L.noNews = l === 'fa' ? 'خبری نیست' : 'No news';
  L.loadMore = l === 'fa' ? 'ادامه اخبار' : 'Load more';
  L.searchHint = l === 'fa' ? 'جستجوی تیم، بازیکن...' : 'Search teams, players...';
  L.fixtures = l === 'fa' ? 'برنامه بازی‌ها' : 'Fixtures';
  document.getElementById('tFav').textContent = L.fav;
  document.getElementById('tSearch').textContent = L.search;
  document.getElementById('tMatches').textContent = L.matches;
  document.getElementById('tNews').textContent = L.news;
  document.getElementById('tMore').textContent = L.more;
  render();
}

function loadData() {
  fetch('/data/news.json?t=' + Date.now())
    .then(function(r) { return r.json(); })
    .then(function(d) { D = d; render(); })
    .catch(function(e) { console.error('Load error:', e); });
}

loadData();
setInterval(loadData, 300000);
</script>
